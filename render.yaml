services:
  - type: web
    name: kichobot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run granian --interface asgi server:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    envVars:
      - key: TZ
        value: Asia/Almaty
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "262144"
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PORT
        sync: false
      - key: DB_URI
        sync: false
      - key: TG_TOKEN
        sync: false
      - key: LOG_CHANEL_ID
        sync: false
      - key: MEDIA_DUMP_CHANNEL_ID
        sync: false
      - key: LOGGER_TG_TOKEN
        sync: false
      - key: BOT_ID
        sync: false
      - key: SCHEDULE_API_KEY
        sync: false
      - key: KSU_DOMAIN
        sync: false
      - key: KSU_LOGIN
        sync: false
      - key: KSU_PASSWORD
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: BOT_MODE
        value: webhook
      - key: WEBHOOK_DOMAIN
        sync: false
      - key: WEBHOOK_PATH
        value: /bot/webhook
      - key: START_BROWSER
        value: "false"
      - key: AUTO_KSU_AUTH
        value: "false"
      - key: USE_FREE_PROXIES
        value: "false"
      - key: DEBUG
        value: "false"
